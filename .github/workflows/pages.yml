name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Upload site contents
        uses: actions/upload-artifact@v4
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-upload
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v1
